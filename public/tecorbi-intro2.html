<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TecOrbi Kids Arena</title>
<style>
:root{--bg:#02030c;--blue:#4a5cff;--green:#9be22b;--fg:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#0b1240 0%,var(--bg) 70%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.stage{position:relative;height:min(calc(100vh - 32px),900px);width:auto;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #ffffff14,0 30px 90px #2a3cff55}
video{width:100%;height:100%;display:block;object-fit:cover}
@media(max-width:560px){.stage{border-radius:12px}}
</style>
</head>
<body>
<main class="stage" id="stage">
<video id="v" playsinline muted autoplay loop preload="auto" poster="/videos/tecorbi-intro-poster.jpg" aria-label="TecOrbi Kids Arena intro">
<source src="/videos/tecorbi-intro.webm" type="video/webm">
<source src="/videos/tecorbi-intro.mp4" type="video/mp4">
</video>
</main>
<script>const v=document.getElementById("v");v.onclick=()=>{v.muted=false;if(v.paused)v.play()};v.play&&v.play().catch(()=>{});</script>
</body>
</html>
